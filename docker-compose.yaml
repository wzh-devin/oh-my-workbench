services:
  app:
    image: oh-my-workbench:local
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ${LOGS_PATH:-app_logs}:/app/apps/api/logs
      - ${NOTES_SECRETS_PATH:-./.secrets}:/app/.secrets:ro
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://workbench:workbench@postgres:5432/workbench?sslmode=disable}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid
    shm_size: 256m
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  app_logs:
  postgres_data:
  redis_data:
