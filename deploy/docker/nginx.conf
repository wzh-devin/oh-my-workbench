pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    absolute_redirect off;
    root /app/web;
    index index.html;
    client_max_body_size 33m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;

    location /api/ {
      proxy_pass http://127.0.0.1:11990;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location ~* ^/assets/.+\.(js|mjs|css|woff2?|ttf|svg|png|jpe?g|webp|gif|wasm)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }

  # Conversion routes stay on loopback, outside the public virtual server.
  server {
    listen 127.0.0.1:13039;
    client_max_body_size 101m;

    location = /thumbnail/health {
      proxy_pass http://127.0.0.1:13040/health;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3s;
    }
    location = /thumbnail {
      proxy_pass http://127.0.0.1:13040/thumbnail;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
      proxy_send_timeout 35s;
    }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }
  }
}
