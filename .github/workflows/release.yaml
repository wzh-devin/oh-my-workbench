name: Release and deploy

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  build:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and main history
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tag must have the form vX.Y.Z' >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main || {
            echo 'Release commit must belong to main' >&2
            exit 1
          }
          repository="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="$repository:$RELEASE_TAG"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push version and latest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}
            ${{ steps.release.outputs.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Join NetBird and wait for SSH
        timeout-minutes: 4
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${NB_SETUP_KEY:?Missing NETBIRD_SETUP_KEY in the deployment environment}"
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST in the deployment environment}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] &&
            ((10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535)) || {
              echo 'DEPLOY_PORT must be between 1 and 65535' >&2
              exit 1
            }

          umask 077
          printf '%s\n' "$NB_SETUP_KEY" > "$RUNNER_TEMP/netbird.key"

          netbird_diagnostics() {
            echo '::group::NetBird startup diagnostics'
            {
              timeout 10 docker inspect --format \
                'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} error={{.State.Error}}' netbird-ci || true
              timeout 10 docker logs --tail 100 netbird-ci || true
              timeout 10 docker exec netbird-ci netbird status -d || true
            } 2>&1 | python3 -c '
          import os, sys
          output = sys.stdin.read()
          key = os.environ.get("NB_SETUP_KEY", "").strip()
          sys.stdout.write(output.replace(key, "***") if key else output)
          ' || true
            echo '::endgroup::'
          }
          trap 'result=$?; if ((result != 0)); then netbird_diagnostics; fi; exit "$result"' EXIT

          docker run -d \
            --name netbird-ci \
            --hostname "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --network host \
            --cap-add NET_ADMIN \
            --cap-add SYS_ADMIN \
            --cap-add SYS_RESOURCE \
            --device /dev/net/tun \
            -v "$RUNNER_TEMP/netbird.key:/run/secrets/setup_key:ro" \
            -e NB_MANAGEMENT_URL=https://netbird.devin.wang \
            -e NB_SETUP_KEY_FILE=/run/secrets/setup_key \
            -e NB_LOG_FILE=console \
            netbirdio/netbird:0.80.0

          for ((attempt=0; attempt<30; attempt++)); do
            if [[ "$(docker inspect --format '{{.State.Running}}' netbird-ci)" != true ]]; then
              echo 'NetBird container exited before SSH became reachable' >&2
              exit 1
            fi
            echo "Waiting for private SSH: attempt $((attempt + 1))/30"
            if timeout 3 bash -c 'exec 3<>"/dev/tcp/$1/$2"' _ "$DEPLOY_HOST" "$DEPLOY_PORT" 2>/dev/null; then
              echo 'Private SSH port is reachable'
              exit 0
            fi
            sleep 2
          done

          echo 'Cannot reach SSH; check NetBird registration, peer approval and the TCP port policy' >&2
          exit 1

      - name: Deploy over SSH and verify
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/oh-my-workbench' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/docker/deploy-over-ssh.sh

      - name: Cleanup NetBird
        if: always()
        run: |
          docker rm -fv netbird-ci >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/netbird.key"
