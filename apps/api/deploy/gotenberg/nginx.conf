pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    set $thumbnail_backend thumbnails:8080;
    set $document_backend gotenberg:3000;
    client_max_body_size 101m;
    location = /thumbnail/health {
      proxy_pass http://$thumbnail_backend/health;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3s;
    }
    location = /thumbnail {
      proxy_pass http://$thumbnail_backend/thumbnail;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
      proxy_send_timeout 35s;
    }
    location / {
      proxy_pass http://$document_backend$request_uri;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }
  }
}
